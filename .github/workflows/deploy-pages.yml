name: Deploy Week 03 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble Pages files
        run: |
          mkdir _site
          cp -R week01 week02 week03 _site/

      - name: Inject DeepSeek key into Week 03 build
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = '_site/week03/index.html';
          const key = process.env.DEEPSEEK_API_KEY || '';
          const html = fs.readFileSync(file, 'utf8');
          fs.writeFileSync(file, html.replaceAll('__DEEPSEEK_API_KEY__', key));
          NODE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
