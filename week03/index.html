<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Association Mirror</title>
  <meta name="description" content="A shared canvas for human and AI associations." />
  <style>
    :root { --deep: #000000; --water: #090a0c; --water-light: #121419; --foam: #ffffff; --mist: #ffffff; --line: rgba(255,255,255,.24); --accent: #ffffff; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { overflow-x: hidden; color: var(--foam); background: var(--deep); font-family: Georgia, "Times New Roman", serif; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .scene { position: relative; min-height: 100dvh; overflow: hidden; background: radial-gradient(circle at 50% 8%, #191b1f 0, var(--water) 37%, var(--deep) 100%); }
    .scene::before, .scene::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .24; background: repeating-radial-gradient(ellipse at 50% 100%, transparent 0 22px, rgba(255,255,255,.18) 24px 25px, transparent 28px 62px); transform: perspective(500px) rotateX(58deg) scale(1.7); transform-origin: bottom; animation: water 14s linear infinite; }
    .scene::after { opacity: .11; transform: perspective(500px) rotateX(58deg) scale(1.85) translateX(13%); animation-duration: 20s; animation-direction: reverse; }
    @keyframes water { from { background-position: 0 0; } to { background-position: 170px 120px; } }
    .topbar { position: absolute; z-index: 5; top: 28px; left: 32px; right: 32px; display: flex; justify-content: space-between; align-items: center; color: var(--mist); font-size: 13px; letter-spacing: .06em; }
    .brand { display: flex; gap: 9px; align-items: center; color: inherit; text-decoration: none; }
    .brand-mark { width: 22px; height: 22px; display: grid; place-items: center; border: 1px solid currentColor; border-radius: 50%; font-size: 12px; }
    .view { position: relative; z-index: 2; min-height: 100dvh; padding: 0 7vw; }
    .entry-view { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; transition: opacity .7s ease, transform .9s ease; }
    .entry-view.leaving { position: absolute; inset: 0; width: 100%; opacity: 0; transform: scale(1.12); pointer-events: none; }
    .entry-title { margin: 0 0 34px; color: var(--mist); font-size: clamp(18px, 2.2vw, 28px); font-weight: 400; letter-spacing: .04em; }
    .word-wrap { position: relative; width: min(760px, 95vw); }
    .word-input { width: 100%; border: 0; border-bottom: 1px solid rgba(255,255,255,.55); outline: 0; padding: 12px 3px 18px; color: var(--foam); background: transparent; text-align: center; font-size: clamp(22px, 3.8vw, 42px); }
    .word-input::placeholder { color: rgba(255,255,255,.55); }
    .word-input:focus { border-color: var(--accent); }
    .word-wrap::after { content: ""; position: absolute; left: 50%; bottom: -14px; width: 10px; height: 10px; border: 1px solid var(--accent); border-radius: 50%; transform: translateX(-50%) scale(0); opacity: 0; transition: transform .5s ease, opacity .5s ease; }
    .word-wrap:focus-within::after { transform: translateX(-50%) scale(1); opacity: 1; animation: pulse 2.6s ease-out infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(228,189,117,.55); } 100% { box-shadow: 0 0 0 28px transparent; } }
    .human-panel { width: min(780px, 94vw); max-height: 0; margin-top: 0; overflow: hidden; opacity: 0; transform: translateY(20px); transition: max-height 1s ease, margin-top 1s ease, opacity .8s ease, transform .8s ease; }
    .human-panel.revealed { max-height: 250px; margin-top: 46px; opacity: 1; transform: translateY(0); }
    .word-wrap:has(.word-input:not(:placeholder-shown)) + .human-panel { max-height: 250px; margin-top: 46px; opacity: 1; transform: translateY(0); }
    .human-label { margin: 0 0 18px; color: var(--mist); font-size: 13px; letter-spacing: .08em; text-transform: lowercase; }
    .human-fields { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .human-field { border: 1px solid var(--line); border-radius: 100px; padding: 13px 17px; outline: 0; color: var(--foam); background: rgba(255,255,255,.04); text-align: center; font-size: 15px; transition: border-color .25s, background .25s; }
    .human-field:focus { border-color: var(--accent); background: rgba(255,255,255,.09); }
    .human-field::placeholder { color: rgba(255,255,255,.55); }
    .make-button { margin-top: 29px; border: 1px solid rgba(255,255,255,.65); border-radius: 100px; padding: 12px 22px; color: #ffffff; background: #16181b; font-size: 14px; transition: transform .2s, background .2s, border-color .2s; }
    .make-button:hover { transform: translateY(-2px); background: #202328; border-color: #ffffff; }
    .make-button:disabled { opacity: .6; cursor: wait; }
    .entry-status { min-height: 18px; margin: 18px 0 0; color: var(--mist); font-size: 12px; }
    .entry-status.error { color: #f3a39a; }
    .api { position: absolute; z-index: 5; left: 32px; bottom: 28px; color: var(--mist); font-size: 11px; }
    .api summary { cursor: pointer; }
    .api-box { display: flex; gap: 7px; margin-top: 8px; }
    .token-input { width: 240px; border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; color: var(--foam); background: rgba(255,255,255,.05); font-size: 11px; }
    .save-button { border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; color: var(--foam); background: transparent; font-size: 11px; }
    .result-view { display: none; opacity: 0; transform: scale(.96); transition: opacity 1s ease, transform 1s ease; padding-top: 9vh; padding-bottom: 8vh; }
    .result-view.visible { display: block; opacity: 1; transform: scale(1); }
    .result-head { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin: 4vh auto 8vh; max-width: 1180px; }
    .result-word { margin: 0; font-family: Georgia, serif; font-size: clamp(34px, 6vw, 74px); font-weight: 400; }
    .result-caption { margin: 0 0 8px; color: var(--mist); font-size: 13px; }
    .reflection { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 0; width: min(1180px, 100%); min-height: min(66vh, 620px); margin: auto; overflow: visible; }
    .reflection::before { content: ""; position: absolute; z-index: 4; top: 0; bottom: 0; left: 50%; border-left: 1px solid var(--line); }
    .side { position: relative; min-height: 520px; display: flex; flex-direction: column; align-items: center; gap: 22px; background: transparent; overflow: visible; }
    .side-title { position: relative; z-index: 3; margin: 0; color: var(--mist); font-size: 13px; font-weight: 400; letter-spacing: .12em; text-transform: uppercase; }
    .orb { position: relative; width: 100%; height: 470px; overflow: visible; transition: transform .55s cubic-bezier(.2,.75,.25,1); }
    .side.ripple-active .orb { transform: translate(var(--wave-x, 0px), var(--wave-y, 0px)) scale(1.025); }
    .notes { position: absolute; inset: 0; z-index: 3; }
    .note { position: absolute; width: 150px; height: 150px; display: grid; place-items: center; padding: 24px; border: 0; border-radius: 48% 52% 47% 53%; color: var(--foam); background: radial-gradient(circle, rgba(255,255,255,.12) 0 2%, rgba(255,255,255,.025) 3% 12%, transparent 13% 100%); cursor: grab; user-select: none; touch-action: none; transform: translate(-50%, -50%) rotate(-2deg); }
    .note::before, .note::after { content: ""; position: absolute; inset: 18px; border: 1px solid rgba(255,255,255,.43); border-radius: 50%; opacity: .7; pointer-events: none; animation: word-ripple 4.8s ease-out infinite; }
    .note::after { inset: 4px; opacity: .27; animation-delay: 1.55s; animation-duration: 5.8s; }
    @keyframes word-ripple { 0% { transform: scale(.78); opacity: 0; } 22% { opacity: .72; } 100% { transform: scale(1.15); opacity: 0; } }
    .note:active { cursor: grabbing; filter: brightness(1.18); z-index: 20 !important; }
    .note p { position: relative; z-index: 2; margin: 0; font-size: 16px; line-height: 1.1; text-align: center; overflow-wrap: anywhere; }
    .note small { display: none; }
    .status { min-height: 19px; margin: 18px auto 0; max-width: 1180px; color: var(--mist); font-size: 12px; text-align: center; }
    .status.error { color: #f3a39a; }
    .canvas { position: absolute; inset: 46px 0 0; z-index: 3; overflow: visible; }
    .note { transition: outline .2s ease, filter .2s ease; }
    .note.selected { outline: 1px solid rgba(255,255,255,.9); outline-offset: 5px; filter: brightness(1.25); }
    .note[data-animation="float"] { animation: float-note 4.8s ease-in-out infinite; }
    .note[data-animation="shake"] { animation: shake-note 1.8s ease-in-out infinite; }
    @keyframes float-note { 0%, 100% { margin-top: 0; } 50% { margin-top: -9px; } }
    @keyframes shake-note { 0%, 100% { margin-left: 0; } 25% { margin-left: -3px; } 75% { margin-left: 3px; } }
    .note.image-note { width: 190px; height: 190px; padding: 0; overflow: hidden; background: #101113; }
    .note.image-note img { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; }
    .note.image-note p { display: none; }
    .control-panel { position: absolute; z-index: 8; left: 50%; bottom: 22px; display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 100px; color: var(--foam); background: rgba(8,9,11,.8); backdrop-filter: blur(8px); transform: translateX(-50%); }
    .control-panel button, .control-panel select { border: 0; border-radius: 100px; padding: 8px 12px; color: var(--foam); background: transparent; font-size: 11px; }
    .control-panel button:hover, .control-panel select:hover { background: rgba(255,255,255,.1); }
    .control-panel button:disabled { cursor: not-allowed; opacity: .28; }
    .control-panel select { outline: 0; }
    .control-panel option { color: #111; }
    .selection-count { min-width: 74px; color: var(--mist); font-size: 11px; text-align: center; }
    .replicate-token { width: 240px; }
    .restart-button { border: 1px solid var(--line); border-radius: 100px; padding: 9px 14px; color: var(--foam); background: transparent; font-size: 12px; }
    .restart-button:hover { background: rgba(255,255,255,.1); }
    @media (max-width: 700px) {
      .topbar { top: 20px; left: 18px; right: 18px; }
      .view { padding: 0 5vw; }
      .human-fields { grid-template-columns: 1fr; gap: 10px; }
      .human-panel.revealed { max-height: 360px; margin-top: 47px; }
      .api { left: 18px; bottom: 20px; }
      .reflection { grid-template-columns: 1fr; min-height: 760px; }
      .reflection::before { top: 50%; bottom: auto; left: 0; right: 0; border-left: 0; border-top: 1px solid var(--line); }
      .side { min-height: 380px; }
      .orb { width: 100%; height: 320px; }
      .result-head { display: block; margin: 2vh auto 5vh; }
      .result-caption { margin-top: 8px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="scene">
    <section class="view entry-view" id="entry-view">
      <h1 class="entry-title">Association Mirror</h1>
      <div id="association-form">
        <div class="word-wrap">
          <input class="word-input" id="prompt" autocomplete="off" placeholder="start with one word or thought" />
        </div>
        <div class="human-panel" id="human-panel">
          <p class="human-label">your associations</p>
          <div class="human-fields">
            <input class="human-field" name="human-1" placeholder="first" />
            <input class="human-field" name="human-2" placeholder="second" />
            <input class="human-field" name="human-3" placeholder="third" />
          </div>
          <button class="make-button" id="submit-button" type="button">make a mirror →</button>
        </div>
        <p class="entry-status" id="entry-status" role="status"></p>
      </div>
    </section>

    <details class="api">
      <summary>API key</summary>
      <div class="api-box">
        <input class="token-input" id="api-token" type="password" placeholder="DeepSeek API key" aria-label="DeepSeek API key" />
        <button class="save-button" id="save-token" type="button">save</button>
        <input class="token-input replicate-token" id="replicate-token" type="password" placeholder="optional NYU auth token" aria-label="Optional NYU auth token" />
      </div>
    </details>

    <section class="view result-view" id="result-view" aria-live="polite">
      <div class="result-head">
        <h2 class="result-word" id="result-word"></h2>
        <div>
          <p class="result-caption">human <span>↔</span> ai</p>
          <button class="restart-button" id="restart-button" type="button">new mirror</button>
        </div>
      </div>
      <div class="reflection" id="reflection">
        <section class="side" aria-labelledby="human-title">
          <h3 class="side-title" id="human-title">human</h3>
        </section>
        <section class="side" aria-labelledby="ai-title">
          <h3 class="side-title" id="ai-title">ai</h3>
        </section>
        <div class="canvas" id="canvas"><div class="notes" id="notes"></div></div>
      </div>
      <p class="status" id="status" role="status"></p>
      <div class="control-panel" aria-label="Selected object controls">
        <span class="selection-count" id="selection-count">0 selected</span>
        <select id="animation-select" aria-label="Animation">
          <option value="none">no animation</option>
          <option value="float">float</option>
          <option value="shake">shake</option>
        </select>
        <button id="delete-button" type="button" disabled>delete</button>
        <button id="restore-button" type="button" disabled>restore pieces</button>
        <button id="mix-button" type="button" disabled>Mix into new image</button>
      </div>
    </section>
  </main>

  <script>
    const form = document.querySelector('#association-form');
    const promptInput = document.querySelector('#prompt');
    const humanPanel = document.querySelector('#human-panel');
    const humanInputs = [...document.querySelectorAll('.human-field')];
    const tokenInput = document.querySelector('#api-token');
    const replicateTokenInput = document.querySelector('#replicate-token');
    const saveToken = document.querySelector('#save-token');
    const submitButton = document.querySelector('#submit-button');
    const entryView = document.querySelector('#entry-view');
    const resultView = document.querySelector('#result-view');
    const resultWord = document.querySelector('#result-word');
    const reflection = document.querySelector('#reflection');
    const canvas = document.querySelector('#canvas');
    const notes = document.querySelector('#notes');
    const status = document.querySelector('#status');
    const entryStatus = document.querySelector('#entry-status');
    const selectionCount = document.querySelector('#selection-count');
    const animationSelect = document.querySelector('#animation-select');
    const deleteButton = document.querySelector('#delete-button');
    const restoreButton = document.querySelector('#restore-button');
    const mixButton = document.querySelector('#mix-button');
    const restartButton = document.querySelector('#restart-button');
    const tokenKey = 'association-mirror-deepseek-token';
    const replicateTokenKey = 'association-mirror-replicate-token';
    const stateKey = 'association-mirror-week03-items';
    let storedItems = [];
    try { const parsedItems = JSON.parse(localStorage.getItem(stateKey) || 'null'); if (Array.isArray(parsedItems)) storedItems = parsedItems; } catch {}
    let items = storedItems;
    items.filter(item => item.type === 'mix' && !Array.isArray(item.sourceIds)).forEach(image => {
      image.sourceIds = items.filter(item => item.hidden && item.type === 'text').map(item => item.id);
    });
    let selectedIds = new Set();
    let currentPrompt = localStorage.getItem('association-mirror-week03-prompt') || '';
    const buildToken = '__DEEPSEEK_API_KEY__';
    const injectedToken = buildToken.startsWith('__') ? '' : buildToken;

    tokenInput.value = localStorage.getItem(tokenKey) || injectedToken;
    replicateTokenInput.value = localStorage.getItem(replicateTokenKey) || '';
    promptInput.value = currentPrompt;
    promptInput.addEventListener('input', () => humanPanel.classList.toggle('revealed', promptInput.value.trim().length > 0));
    form.addEventListener('keydown', event => { if (event.key === 'Enter' && event.target.matches('#prompt, .human-field')) event.preventDefault(); });
    saveToken.addEventListener('click', () => {
      localStorage.setItem(tokenKey, tokenInput.value.trim());
      localStorage.setItem(replicateTokenKey, replicateTokenInput.value.trim());
      setStatus('saved');
    });

    function setStatus(message, error = false) {
      status.textContent = message;
      entryStatus.textContent = message;
      status.classList.toggle('error', error);
      entryStatus.classList.toggle('error', error);
    }

    function saveState() {
      localStorage.setItem(stateKey, JSON.stringify(items));
      localStorage.setItem('association-mirror-week03-prompt', currentPrompt);
    }

    function makeId() { return `item-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`; }

    function randomPosition(source, index, width = 150, height = 150) {
      const bounds = canvas.getBoundingClientRect();
      const sideWidth = bounds.width / 2;
      const start = source === 'human' ? 30 : sideWidth + 30;
      const end = source === 'human' ? sideWidth - width - 30 : bounds.width - width - 30;
      return { x: Math.max(10, start + Math.random() * Math.max(20, end - start)), y: 60 + Math.random() * Math.max(40, bounds.height - height - 100) };
    }

    function createTextItem(content, source, index) {
      const point = randomPosition(source, index);
      return { id: makeId(), type: 'text', content, x: point.x, y: point.y, rotation: [-2, 1, -1][index % 3], z: items.length + index + 1, source, animation: 'none', hidden: false };
    }

    function render() {
      notes.replaceChildren();
      items.filter(item => !item.hidden).forEach(item => {
        const note = document.createElement('article');
        note.className = `note ${item.type === 'text' ? '' : 'image-note'} ${selectedIds.has(item.id) ? 'selected' : ''}`;
        note.dataset.id = item.id;
        note.dataset.animation = item.animation || 'none';
        note.style.left = `${item.x}px`;
        note.style.top = `${item.y}px`;
        note.style.zIndex = item.z || 1;
        note.style.transform = `translate(-50%, -50%) rotate(${item.rotation || 0}deg)`;
        if (item.type === 'text') {
          note.innerHTML = '<p></p>';
          note.querySelector('p').textContent = item.content;
        } else {
          const image = document.createElement('img');
          image.src = item.content;
          image.alt = 'AI mixed image';
          note.append(image);
        }
        addDrag(note, item);
        notes.append(note);
      });
      updateControls();
    }

    function selectItem(item, additive) {
      if (!additive) selectedIds.clear();
      if (additive && selectedIds.has(item.id)) selectedIds.delete(item.id);
      else selectedIds.add(item.id);
      notes.querySelectorAll('.note').forEach(note => note.classList.toggle('selected', selectedIds.has(note.dataset.id)));
      updateControls();
    }

    function addDrag(note, item) {
      let startX = 0, startY = 0, originX = 0, originY = 0;
      note.addEventListener('pointerdown', event => {
        event.preventDefault();
        selectItem(item, event.shiftKey);
        note.setPointerCapture(event.pointerId);
        startX = event.clientX;
        startY = event.clientY;
        originX = item.x;
        originY = item.y;
        item.z = Math.max(...items.map(entry => entry.z || 0), 0) + 1;
        note.style.zIndex = item.z;
      });
      note.addEventListener('pointermove', event => {
        if (!note.hasPointerCapture(event.pointerId)) return;
        const bounds = canvas.getBoundingClientRect();
        item.x = Math.max(8, Math.min(bounds.width - 8, originX + event.clientX - startX));
        item.y = Math.max(50, Math.min(bounds.height - 8, originY + event.clientY - startY));
        note.style.left = `${item.x}px`;
        note.style.top = `${item.y}px`;
      });
      note.addEventListener('pointerup', event => {
        if (note.hasPointerCapture(event.pointerId)) note.releasePointerCapture(event.pointerId);
        saveState();
        render();
      });
    }

    function updateControls() {
      const count = selectedIds.size;
      selectionCount.textContent = `${count} selected`;
      deleteButton.disabled = count === 0;
      mixButton.disabled = count < 2;
      restoreButton.disabled = !items.some(item => selectedIds.has(item.id) && item.type === 'mix' && item.sourceIds?.length);
      const selected = items.find(item => selectedIds.has(item.id));
      animationSelect.value = selected?.animation || 'none';
    }

    animationSelect.addEventListener('change', () => {
      items.filter(item => selectedIds.has(item.id)).forEach(item => { item.animation = animationSelect.value; });
      saveState();
      render();
    });

    deleteButton.addEventListener('click', () => {
      items = items.filter(item => !selectedIds.has(item.id));
      selectedIds.clear();
      saveState();
      render();
      setStatus('deleted');
    });

    restoreButton.addEventListener('click', () => {
      const generated = items.filter(item => selectedIds.has(item.id) && item.type === 'mix');
      generated.forEach(image => {
        items.forEach(item => { if (image.sourceIds?.includes(item.id)) item.hidden = false; });
        image.hidden = true;
      });
      selectedIds.clear();
      saveState();
      render();
      setStatus('source pieces restored; choose a new arrangement');
    });

    function parseAssociations(raw) {
      const clean = raw.trim().replace(/^```(?:json)?\s*|\s*```$/gi, '');
      try {
        const parsed = JSON.parse(clean);
        const values = Array.isArray(parsed) ? parsed : (parsed.associations || parsed.parts || parsed.words || []);
        if (Array.isArray(values)) return values.map(value => String(value).trim()).filter(Boolean).slice(0, 3);
      } catch {}
      return clean.replace(/^[\s\d.)-]+/gm, '').split(/[\n,;，、]+/).map(value => value.trim().replace(/^['"“”]|['"“”]$/g, '')).filter(Boolean).slice(0, 3);
    }

    async function getAiAssociations(prompt, token) {
      if (!token) throw new Error('add your DeepSeek API key first');
      let response;
      try {
        response = await fetch('https://api.deepseek.com/chat/completions', {
          method: 'POST',
          headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: 'deepseek-chat',
            messages: [{ role: 'system', content: 'Return exactly 3 short associations as JSON only: {"associations":["one","two","three"]}. Do not add explanations.' }, { role: 'user', content: `Give three distinct associations for "${prompt}".` }],
            response_format: { type: 'json_object' },
            max_tokens: 180,
            temperature: .85,
            stream: false
          })
        });
      } catch { throw new Error('could not connect to DeepSeek; check your internet connection'); }
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error?.message || `DeepSeek error ${response.status}`);
      const raw = data.choices?.[0]?.message?.content || '';
      if (!raw) throw new Error('DeepSeek returned no usable associations; please try again');
      const associations = parseAssociations(raw);
      if (associations.length < 3) throw new Error('DeepSeek returned fewer than 3 associations; please try again');
      return associations;
    }

    function relationPrompt(selected) {
      const xs = selected.map(item => item.x);
      const ys = selected.map(item => item.y);
      const minX = Math.min(...xs), maxX = Math.max(...xs, minX + 1);
      const minY = Math.min(...ys), maxY = Math.max(...ys, minY + 1);
      const elements = selected.map(item => {
        const horizontal = item.x < minX + (maxX - minX) * .33 ? 'left' : item.x > minX + (maxX - minX) * .66 ? 'right' : 'center';
        const vertical = item.y < minY + (maxY - minY) * .33 ? 'top' : item.y > minY + (maxY - minY) * .66 ? 'bottom' : 'middle';
        const content = item.type === 'text' ? item.content : 'a small existing image fragment';
        return `- "${content}" in the ${vertical} ${horizontal} area of the composition`;
      }).join('; ');
      const relations = [];
      selected.forEach((first, firstIndex) => selected.slice(firstIndex + 1).forEach(second => {
        const firstName = first.type === 'text' ? first.content : 'the existing image fragment';
        const secondName = second.type === 'text' ? second.content : 'the existing image fragment';
        const vertical = Math.abs(first.y - second.y) > 55 ? (first.y < second.y ? 'above' : 'below') : '';
        const horizontal = Math.abs(first.x - second.x) > 55 ? (first.x < second.x ? 'left of' : 'right of') : 'near';
        relations.push(`- "${firstName}" is ${vertical ? `${vertical} and ` : ''}${horizontal} "${secondName}"`);
      }));
      return `You are a visual composition engine. Generate one unified image from the user's selected elements and their current arrangement. The selected elements and the spatial relationships below are the only content instructions for this image. Do not use any fixed example, familiar story, default character, or unrelated association.

Selected elements and their positions:
${elements}

Spatial relationships:
${relations.join('\n')}

Read the arrangement as visual grammar. Use the actual positions, distance, overlap, alignment, and layering to decide how the selected elements relate to one another. A change in arrangement must be able to change the meaning of the resulting image. Do not simply place the selected elements side by side. Let nearby elements interact, let one element support or surround another when the arrangement suggests it, and let overlapping elements visually combine. Interpret each selected word according to its own meaning and qualities. If a selected word is a color, texture, quality, or abstract idea, apply it to the nearest compatible selected element or represent it as a simple visual quality. Do not turn it into an unrelated new object.

Use every selected element. Do not add anything that was not selected: no extra animals, people, characters, body parts, buildings, vehicles, landscape objects, symbols, or narrative props. Do not invent a story outside the selected elements. Do not include written words, labels, letters, interface elements, or captions. Do not create a sticker sheet, grid, moodboard, object pile, random blob, sphere, ball, globe, or circular container. Make one coherent, imaginative but visually specific image with clear relationships and natural visual continuity.`;
    }

    function extractImageUrl(value) {
      if (typeof value === 'string' && /^https?:\/\//.test(value)) return value;
      if (Array.isArray(value)) for (const entry of value) { const found = extractImageUrl(entry); if (found) return found; }
      if (value && typeof value === 'object') for (const entry of Object.values(value)) { const found = extractImageUrl(entry); if (found) return found; }
      return '';
    }

    async function mixSelected() {
      const selected = items.filter(item => selectedIds.has(item.id));
      if (selected.length < 2) return;
      mixButton.disabled = true;
      mixButton.textContent = 'mixing…';
      setStatus('reading the arrangement…');
      try {
        const headers = { 'Content-Type': 'application/json' };
        const auth = replicateTokenInput.value.trim() || localStorage.getItem(replicateTokenKey) || '';
        headers.Authorization = `Bearer ${auth}`;
        const response = await fetch('https://itp-ima-replicate-proxy.web.app/api/create_n_get', {
          method: 'POST', headers,
          body: JSON.stringify({
            model: 'black-forest-labs/flux-schnell',
            input: {
              prompt: relationPrompt(selected),
              go_fast: true,
              num_outputs: 1,
              aspect_ratio: '1:1',
              output_format: 'webp',
              output_quality: 80
            }
          })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || data.message || data.detail || `image API error ${response.status}`);
        const imageUrl = extractImageUrl(data);
        if (!imageUrl) throw new Error('image API returned no image');
        const center = selected.reduce((point, item) => ({ x: point.x + item.x, y: point.y + item.y }), { x: 0, y: 0 });
        center.x /= selected.length; center.y /= selected.length;
        items.forEach(item => { if (selectedIds.has(item.id)) item.hidden = true; });
        items.push({ id: makeId(), type: 'mix', content: imageUrl, sourceIds: selected.map(item => item.id), x: center.x, y: center.y, rotation: -1, z: Math.max(...items.map(item => item.z || 0), 0) + 1, source: 'ai', animation: 'float', hidden: false });
        selectedIds.clear();
        saveState();
        render();
        setStatus('new image added; the original fragments are still saved');
      } catch (error) { setStatus(error.message, true); }
      finally { mixButton.disabled = selectedIds.size < 2; mixButton.textContent = 'Mix into new image'; }
    }

    mixButton.addEventListener('click', mixSelected);

    restartButton.addEventListener('click', () => {
      resultView.classList.remove('visible');
      entryView.classList.remove('leaving');
      humanPanel.classList.add('revealed');
      entryStatus.textContent = '';
      promptInput.focus();
    });

    async function submitAssociation() {
      const prompt = promptInput.value.trim();
      const human = humanInputs.map(input => input.value.trim());
      if (!human.every(Boolean)) { setStatus('add three associations', true); return; }
      submitButton.disabled = true;
      submitButton.textContent = 'ripple…';
      try {
        const ai = await getAiAssociations(prompt, tokenInput.value.trim() || localStorage.getItem(tokenKey) || '');
        resultWord.textContent = prompt;
        entryView.classList.add('leaving');
        resultView.classList.add('visible');
        currentPrompt = prompt;
        items = [];
        selectedIds.clear();
        human.forEach((item, index) => items.push(createTextItem(item, 'human', index)));
        ai.forEach((item, index) => items.push(createTextItem(item, 'ai', index)));
        saveState();
        render();
        setStatus('shift-click to select; drag fragments across the canvas');
      } catch (error) { setStatus(error.message, true); }
      finally { submitButton.disabled = false; submitButton.textContent = 'make a mirror →'; }
    }

    submitButton.addEventListener('click', submitAssociation);

    if (items.length && currentPrompt) {
      resultWord.textContent = currentPrompt;
      entryView.classList.add('leaving');
      resultView.classList.add('visible');
      render();
    }
  </script>
</body>
</html>
